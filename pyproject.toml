[project]
name = "holonomy-lib"
version = "0.8.0"
description = "Batched PyTorch primitives for Riemannian geometry, spectral graph theory, discrete curvature, topology, and tensor decompositions."
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [{ name = "Jack" }]
requires-python = ">=3.12"
keywords = [
    "pytorch",
    "differential-geometry",
    "riemannian-manifolds",
    "hyperbolic-geometry",
    "riemannian-optimization",
    "spectral-graph-theory",
    "graph-laplacian",
    "magnetic-laplacian",
    "heat-kernel",
    "diffusion-maps",
    "effective-resistance",
    "ricci-curvature",
    "ricci-flow",
    "cellular-sheaves",
    "simplicial-complex",
    "hodge-laplacian",
    "persistent-homology",
    "topological-data-analysis",
    "information-geometry",
    "tensor-decomposition",
    "numerical-linear-algebra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# The floors are the first releases that ship Python 3.12 wheels; nothing in
# the source needs anything newer. torch decides the hardware: pip picks the
# default CUDA wheel, so for ROCm, a specific CUDA version or CPU-only, install
# torch first from https://pytorch.org/get-started/locally/ and pip will keep it.
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11.2",
]

[project.urls]
Homepage = "https://github.com/Synoros-io/holonomy_lib"
Repository = "https://github.com/Synoros-io/holonomy_lib"
Issues = "https://github.com/Synoros-io/holonomy_lib/issues"

[project.optional-dependencies]
# Libraries the cross-check tests compare against. None of them are needed at
# runtime; each comparison test skips itself when its library is missing.
comparison = [
    "pymanopt",
    "geoopt",
    "geomstats",
    "autograd",
    "tensorly",
    "networkx",
    "gudhi",
    "ripser",
    "GraphRicciCurvature",
]

# Development toolchain: tests, lint, type checks (with SciPy's stubs so mypy
# can see through the sparse and quadrature fallbacks).
dev = ["pytest", "ruff", "mypy", "scipy-stubs"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".scratch", "archive", "notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
